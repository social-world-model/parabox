[project]
name = "parabox"
version = "0.2.0"
description = "Evaluate models' own violations, influence on peers, and contributions to shared work"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "licenses/*.txt"]
requires-python = ">=3.12"
dependencies = ["python-dotenv>=1.0"]

[project.scripts]
parabox = "parabox.__main__:main"
parabox-benchmark = "parabox.benchmark.__main__:main"
parabox-game = "parabox.games.play:main"

[project.optional-dependencies]
report = ["matplotlib>=3.8"]
browser = ["playwright>=1.50,<2"]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["build>=1.2", "setuptools>=77", "mdformat==1.0.0", "mdformat-gfm==1.0.0"]

[tool.setuptools.packages.find]
include = ["parabox*"]
exclude = ["parabox.studies*", "parabox.tasks.lean*"]

[tool.setuptools.package-data]
"parabox.benchmark" = ["assets/*.json"]
"parabox.tasks.code" = ["image/**/*", "oracle/*.txt"]
