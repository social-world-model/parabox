name: Framework checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: python -m pip install uv==0.12.15
      - run: uv sync --locked --extra report --group dev --python "$(command -v python)"
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m unittest discover -s tests -t .
      - run: python -m scripts.release_check
      - run: python -m build
      - run: |
          for archive in dist/*.whl dist/*.tar.gz; do
            python -m scripts.release_check --archive "$archive"
          done
      - run: python -m venv /tmp/parabox-installed
      - run: /tmp/parabox-installed/bin/pip install dist/*.whl
      - run: cd /tmp && /tmp/parabox-installed/bin/parabox --help
      - run: cd /tmp && /tmp/parabox-installed/bin/parabox-benchmark selftest
      - run: cd /tmp && /tmp/parabox-installed/bin/python -m parabox.benchmark.ternary --help
      - run: cd /tmp && /tmp/parabox-installed/bin/python -m parabox.records --help
      - run: cd /tmp && /tmp/parabox-installed/bin/python -c "import importlib.util; assert importlib.util.find_spec('parabox.studies') is None"

  markdown:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.15
      - run: uv sync --locked --group dev --python "$(command -v python)"
      - run: .venv/bin/python -m mdformat --check $(git ls-files '*.md')

  browser-game:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.15
      - run: uv sync --locked --extra browser --group dev
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: PARABOX_BROWSER_TESTS_REQUIRED=1 .venv/bin/python -m unittest tests.games.test_choicescript tests.games.test_choicescript_runner -v

  container-instrument:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: python -m pip install uv==0.12.15
      - run: uv sync --locked --extra report --group dev --python "$(command -v python)"
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m build
      - run: uv pip install --python "$(command -v python)" --reinstall-package parabox --no-deps dist/*.whl
      - run: podman build -t localhost/parabox-code:py312 parabox/tasks/code/image
      - run: cd /tmp && parabox-benchmark selftest
      - run: cd /tmp && python -m parabox.benchmark.ternary --help
      - run: |
          image_id="$(podman image inspect localhost/parabox-code:py312 --format '{{.Id}}')"
          PARABOX_EPISODE_TEST_IMAGE="$image_id" python -m unittest tests.wiki.test_wiki_task_episode tests.ternary.test_benchmark_container
      - run: cd /tmp && python -c "import importlib.util; assert importlib.util.find_spec('parabox.studies') is None"
